<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDK | Holiday Planner</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">

    <!-- ============================================================
  QUICK EDIT GUIDE
  ---------------------------------------------------------------
  Same layout and look as the website's Planner (sis.idklabs.in → Planner), but you
  type your attendance numbers in yourself.

  1. YOUR ATTENDANCE, SGT + CP BATCH, DATE, HOLIDAYS
     → Entered in the page itself; saved in this browser.

  2. TIMETABLE, CLINICAL POSTINGS, SUBJECTS, THRESHOLDS, COLLEGE HOLIDAYS
     → Don't edit here. Edit timetables/timetable_2nd_prof.xlsx and run
       python3 scripts/make_timetable.py
       (rewrites the PLANNER block between the @generated markers below; see TIMETABLE.md).

  3. CHANGE COLOURS / FONTS
     → Edit the CSS :root variables below (subject colours come from the workbook).
       They match the website's "quiet paper" theme (app/src/index.css).
============================================================ -->

    <style>
        :root {
            --font-display: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-body: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, monospace;

            --bg: #FAFAF8;
            --surface: #FFFFFF;
            --surface2: #F2F0EC;
            /* warm grey: panels, chips, inputs */
            --border: #ECEAE5;
            --border-str: #DEDBD4;
            --text: #161616;
            --muted: #6F6E6A;
            --faint: #A4A29C;
            --accent: #3D6A8C;
            --good: #2E7D5B;
            --warn: #B4832A;
            --bad: #C4472F;
            --fixed: #D9B870;
            --track: rgba(22, 22, 22, .08);
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            -webkit-text-size-adjust: 100%;
        }

        body {
            font-family: var(--font-body);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
            line-height: 1.5;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        .mono {
            font-family: var(--font-mono);
            font-feature-settings: 'tnum' 1;
        }

        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 2.5rem 1.25rem 4rem;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .page>* {
            animation: fadeUp .45s cubic-bezier(.2, .7, .2, 1) both;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation: none !important;
                transition: none !important;
            }
        }

        /* ---- Header (title left; batches, Reset, Export right) ---- */
        .top {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            flex-wrap: wrap;
            gap: 1rem;
            margin-bottom: 1.25rem;
        }

        .idk-mark {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            font-weight: 500;
            color: var(--muted);
            margin-bottom: 10px;
        }

        .top h1 {
            font-size: 1.875rem;
            font-weight: 500;
            letter-spacing: -.035em;
            line-height: 1.1;
        }

        .top p {
            margin-top: 4px;
            font-size: 14px;
            color: var(--muted);
        }

        .top-actions {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        /* ---- Buttons: pills ---- */
        button {
            font: inherit;
            font-size: 14px;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            border-radius: 999px;
            border: 1px solid var(--border-str);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            white-space: nowrap;
            transition: background .15s, border-color .15s;
        }

        button:hover {
            background: var(--surface2);
        }

        button:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        button.primary {
            background: var(--text);
            border-color: var(--text);
            color: #fff;
        }

        button.primary:hover {
            background: #000;
        }

        button.sm {
            font-size: 12px;
            padding: 5px 12px;
        }

        /* ---- Batch pickers ---- */
        .batch-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 10px;
        }

        .batch-row .lab {
            font-size: 12px;
            color: var(--muted);
        }

        .seg {
            display: inline-flex;
            gap: 2px;
            padding: 2px;
            border: 1px solid var(--border-str);
            border-radius: 999px;
            background: var(--surface);
            transition: box-shadow .2s;
        }

        .seg button {
            border: 0;
            padding: 5px 12px;
            font-size: 13px;
            background: transparent;
        }

        .seg button:hover {
            background: var(--surface2);
        }

        .seg button.on {
            background: var(--text);
            color: #fff;
        }

        .batch-row.missing .seg {
            box-shadow: 0 0 0 3px rgba(61, 106, 140, .25);
        }

        /* ---- Cards ---- */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            min-width: 0;
        }

        .info {
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 16px;
            margin-bottom: 1.75rem;
            font-size: 14px;
            color: var(--muted);
        }

        .info svg {
            flex-shrink: 0;
            margin-top: 2px;
            color: var(--accent);
        }

        .info b {
            color: var(--bad);
            font-weight: 500;
        }

        /* ---- Section heads: tag chip on the left, tools on the right ---- */
        .sec-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 12px;
        }

        .eyebrow {
            display: inline-flex;
            padding: 3px 10px;
            border-radius: 999px;
            background: var(--surface2);
            font-size: 12px;
            font-weight: 500;
        }

        .sec-tools {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .date-input {
            font: inherit;
            font-family: var(--font-mono);
            font-size: 12px;
            width: 92px;
            text-align: center;
            padding: 5px 10px;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: var(--surface2);
            color: var(--text);
        }

        .date-input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
        }

        /* ---- Subject cards (current + projected), like the website's Planner ---- */
        .grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 2.5rem;
        }

        .subj {
            padding: 20px;
        }

        .subj-head {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 16px;
        }

        .subj-head .sdot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--c);
            flex-shrink: 0;
        }

        .subj-head h3 {
            flex: 1;
            min-width: 0;
            font-size: 17px;
            font-weight: 500;
            letter-spacing: -.02em;
            color: color-mix(in srgb, var(--c) 78%, var(--text));
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subj-head .mode {
            font-size: 12px;
            color: var(--faint);
        }

        .trow+.trow {
            margin-top: 14px;
        }

        .trow-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
            font-size: 14px;
        }

        .tlabel {
            font-weight: 500;
            white-space: nowrap;
        }

        .need {
            font-size: 12px;
            font-weight: 400;
            color: var(--faint);
        }

        .short-tag {
            margin-left: 4px;
            font-size: 10px;
            font-weight: 700;
            color: var(--bad);
        }

        .tval {
            display: flex;
            align-items: baseline;
            gap: 6px;
            white-space: nowrap;
        }

        .tval b {
            font-weight: 600;
        }

        .tpct {
            font-size: 12px;
        }

        .none {
            font-size: 12px;
            color: var(--faint);
        }

        /* present / total inputs inside the current cards */
        .num {
            font: inherit;
            font-family: var(--font-mono);
            font-size: 13px;
            font-weight: 500;
            width: 46px;
            padding: 3px 0;
            text-align: center;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--surface2);
            color: var(--text);
            -moz-appearance: textfield;
            appearance: textfield;
        }

        .num::-webkit-inner-spin-button,
        .num::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .num:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--surface);
            box-shadow: 0 0 0 3px rgba(61, 106, 140, .15);
        }

        .slash {
            color: var(--faint);
            align-self: center;
        }

        .bar {
            height: 6px;
            border-radius: 99px;
            background: var(--track);
            overflow: hidden;
        }

        .fill {
            height: 100%;
            border-radius: 99px;
            transition: width .5s cubic-bezier(.22, 1, .36, 1);
        }

        .tfoot {
            display: flex;
            justify-content: flex-end;
            margin-top: 6px;
        }

        .tfoot:empty {
            display: none;
        }

        .tpill {
            font-size: 12px;
            font-weight: 500;
            padding: 2px 10px;
            border-radius: 99px;
            white-space: nowrap;
        }

        /* status tones: same bands as the website */
        .tone-good {
            --tone: var(--good);
        }

        .tone-warn {
            --tone: var(--warn);
        }

        .tone-bad {
            --tone: var(--bad);
        }

        .tone-neutral {
            --tone: var(--faint);
        }

        .tpct[class*=tone-] {
            color: var(--tone);
        }

        .fill[class*=tone-] {
            background: var(--tone);
        }

        .tpill[class*=tone-] {
            color: var(--tone);
            background: color-mix(in srgb, var(--tone) 14%, transparent);
        }

        .notice {
            padding: 20px;
            margin-bottom: 2.5rem;
            font-size: 14px;
            color: var(--muted);
        }

        .notice strong {
            color: var(--text);
            font-weight: 500;
        }

        /* ---- Calendar legend ---- */
        .legend {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px 12px;
            font-size: 12px;
            color: var(--muted);
        }

        .leg {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sw {
            width: 10px;
            height: 10px;
            border-radius: 3px;
            flex-shrink: 0;
        }

        /* ---- Calendar ---- */
        .cal-tools {
            margin-bottom: 1rem;
        }

        .cal-tools:empty {
            display: none;
        }

        .week-block {
            margin-bottom: 1.5rem;
        }

        .week-title {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: .12em;
            text-transform: uppercase;
            color: var(--faint);
            margin-bottom: 8px;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, minmax(0, 1fr));
            gap: 8px;
        }

        .day-cell {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-height: 104px;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 14px;
            background: var(--surface);
            cursor: pointer;
            user-select: none;
            transition: background .15s, border-color .15s;
            -webkit-tap-highlight-color: transparent;
        }

        .day-cell:not(.fixed):not(.past):not(.no-classes):not(.holiday):hover {
            border-color: var(--border-str);
            background: #FCFCFB;
        }

        .day-cell.no-classes {
            background: transparent;
            border-style: dashed;
            cursor: default;
        }

        .day-cell.holiday {
            background: color-mix(in srgb, var(--bad) 8%, var(--surface));
            border-color: color-mix(in srgb, var(--bad) 35%, transparent);
        }

        .day-cell.fixed {
            background: color-mix(in srgb, var(--warn) 9%, var(--surface));
            border-color: color-mix(in srgb, var(--warn) 30%, transparent);
            cursor: default;
        }

        .day-cell.past {
            background: var(--surface2);
            border-color: transparent;
            cursor: default;
            opacity: .55;
        }

        .day-top {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .day-date {
            font-size: 10px;
            color: var(--faint);
        }

        .day-name {
            font-size: 14px;
            font-weight: 500;
            letter-spacing: -.015em;
        }

        .class-count {
            font-size: 9px;
            font-weight: 600;
            color: var(--muted);
        }

        .badge {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: .04em;
            padding: 2px 6px;
            border-radius: 99px;
        }

        .badge-off {
            background: color-mix(in srgb, var(--bad) 22%, transparent);
            color: var(--bad);
        }

        .badge-fixed {
            background: color-mix(in srgb, var(--warn) 25%, transparent);
            color: var(--warn);
        }

        .badge-past {
            background: var(--border-str);
            color: var(--muted);
        }

        .pills {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            margin-top: 2px;
        }

        .pill {
            font-size: 9px;
            font-weight: 600;
            padding: 2px 6px;
            border-radius: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--c);
            background: color-mix(in srgb, var(--c) 14%, transparent);
        }

        /* "Show class details": the longer pills wrap instead of cutting off */
        .pill.wrap {
            white-space: normal;
            line-height: 1.3;
        }

        /* FA / UHV: shown, not counted */
        .pill.event {
            color: var(--muted);
            background: transparent;
            border: 1px dashed var(--border-str);
        }

        /* Notes from the workbook ("Not sure: …"), shown in full */
        .day-note {
            font-size: 9px;
            font-style: italic;
            line-height: 1.3;
            color: var(--warn);
            overflow-wrap: anywhere;
        }

        .no-class {
            font-size: 10px;
            color: var(--faint);
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(80px);
            padding: 9px 18px;
            border-radius: 99px;
            background: var(--text);
            color: #fff;
            font-size: 13px;
            opacity: 0;
            transition: opacity .25s, transform .25s;
            z-index: 9999;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ---- Responsive ---- */
        @media (max-width: 980px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .days-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page {
                padding: 1.5rem 1rem 3rem;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .days-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }

            .day-cell {
                min-height: 92px;
            }
        }
    </style>
</head>

<body>
    <div class="page">

        <header class="top">
            <div>
                <div class="idk-mark">
                    <svg width="26" height="16" viewBox="0 0 30 18" aria-hidden="true">
                        <polyline points="1,9 9,9 13,3 18,15 22,9 29,9" fill="none" stroke="currentColor"
                            stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round" />
                    </svg>
                    IDK
                </div>
                <h1>Holiday Planner</h1>
                <p id="termLabel"></p>
            </div>
            <div class="top-actions">
                <div class="batch-row" id="batchRow"></div>
                <button onclick="resetHolidays()" title="Clear the days you marked off">&#x21BA; Reset</button>
                <button class="primary" onclick="exportSummary()">&#x2B07; Export</button>
            </div>
        </header>

        <div class="card info">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3" y="5" width="18" height="16" rx="3" />
                <path d="M3 10h18M8 3v4M16 3v4" />
            </svg>
            <p id="infoText"></p>
        </div>

        <!-- CURRENT: type your present / total numbers straight into the cards -->
        <div class="sec-head">
            <div class="eyebrow">Current attendance</div>
            <div class="sec-tools">
                <label for="refDate">Data as of</label>
                <input class="date-input" type="text" id="refDate" placeholder="DD-MM-YY" maxlength="8"
                    oninput="onRefDateInput()">
                <button class="sm" onclick="shareURL()" title="Copy a link with your numbers pre-filled">Share
                    link</button>
                <button class="sm" onclick="resetAttendance()" title="Clear your numbers, batches and holidays">Reset
                    data</button>
            </div>
        </div>
        <div class="grid" id="currentCards"></div>

        <div id="planRoot"></div>

    </div><!-- .page -->

    <div id="toast"></div>

    <script>
        // ============================================================
        // TIMETABLE — generated from timetables/timetable_2nd_prof.xlsx by
        //   python3 scripts/make_timetable.py
        // Each day: classes everyone attends + `batches` (extra classes per SGT / CP batch),
        // `events` (FA / UHV — shown, not counted), `notes` ("Not sure: …").
        // Classes keep the type as written (DOAP, SGD, SEM …); `typeMap` says how each counts.
        // L already includes SDL (they count the same for attendance).
        // ============================================================
        // @generated:begin - written by scripts/make_timetable.py from the timetable workbook.
        // Don't edit by hand: change the workbook and run the script again.
        const PLANNER = {
            id: "mbbs-prof-2",
            label: "MBBS · 2nd Prof",
            endDate: "26 Jun",
            subjects: [{"code": "PH", "name": "Pharmacology", "color": "#b8860b"}, {"code": "MI", "name": "Microbiology", "color": "#3a7d44"}, {"code": "PA", "name": "Pathology", "color": "#2c5f8a"}, {"code": "CM", "name": "Community Medicine", "color": "#7a5c99"}, {"code": "FM", "name": "Forensic Medicine", "color": "#8a4b3c"}, {"code": "MED", "name": "Medicine", "color": "#2f8f83"}, {"code": "SU", "name": "Surgery", "color": "#5f6b7a"}, {"code": "OG", "name": "Obst & Gynae", "color": "#b04a7a"}, {"code": "PED", "name": "Paediatrics", "color": "#c2622d"}, {"code": "ENT", "name": "ENT", "color": "#4a55b5"}, {"code": "OP", "name": "Ophthalmology", "color": "#6e7f22"}, {"code": "ANS", "name": "Anaesthesia", "color": "#a432ae"}, {"code": "CHEST", "name": "Chest & TB", "color": "#5a562b"}, {"code": "DENT", "name": "Dentistry", "color": "#2c962c"}, {"code": "ORTHO", "name": "Orthopaedics", "color": "#ae323d"}, {"code": "PSY", "name": "Psychiatry", "color": "#a3793e"}, {"code": "RAD", "name": "Radiology", "color": "#5c32ae"}, {"code": "SKIN", "name": "Skin", "color": "#7e2577"}],
            thresholds: {"CP": 85, "L": 80, "SGT": 85},
            typeMap: {"L": "L", "SDL": "L", "SGT": "SGT", "P": "SGT", "DOAP": "SGT", "SGD": "SGT", "SGL": "SGT", "CAL": "SGT", "CBD": "SGT", "SEM": "SGT", "TUT": "SGT", "R": "SGT", "CP": "CP", "LGD": "SGT", "FAP": "SGT"},
            batchGroups: [{"id": "sgt", "label": "SGT batch", "options": ["A", "B"]}, {"id": "cp", "label": "CP batch", "options": ["A", "B", "C", "D"]}],
            weekOrder: ["Week 1", "Week 2", "Week 3", "Week 4", "Week 5", "Week 6", "Week 7", "Week 8", "Week 9", "Week 10", "Week 11", "Week 12", "Week 13", "Week 14", "Week 15", "Week 16", "Week 17", "Week 18", "Week 19", "Week 20", "Week 21", "Week 22", "Week 23", "Week 24", "Week 25", "Week 26", "Week 27", "Week 28", "Week 29", "Week 30", "Week 31", "Week 32", "Week 33", "Week 34", "Week 35", "Week 36", "Week 37", "Week 38", "Week 39"],
            timetable: [

                <span class="lab">${esc(g.label)}</span>
                <span class="seg" role="radiogroup" aria-label="${esc(g.label)}">${g.options.map(o =>
                `<button role="radio" aria-checked="${picks[g.id] === o}" class="${picks[g.id] === o ? 'on' : ''}"
                    onclick="chooseBatch('${g.id}','${o}')">${esc(o)}</button>`).join('')}</span>`).join('');
        }

        function chooseBatch(groupId, option) {
            picks = { ...picks, [groupId]: option };
            saveToStorage();
            render();
        }

        // ============================================================
        // RENDER: subject cards (same layout as the website's Planner)
        // ============================================================
        function subjectCard({ name, color }, mode, rows) {
            return `<div class="card subj" style="--c:${color}">
                <div class="subj-head"><span class="sdot"></span><h3 title="${esc(name)}">${esc(name)}</h3><span class="mode">${mode}</span></div>
                ${rows}
            </div>`;
        }

        // CURRENT — your numbers, typed into the card. Updating a row on input leaves the boxes alone,
        // so typing never loses focus.
        function currentRowParts(s, t) {
            const { present, total } = ATT[s][t];
            const req = THRESHOLDS[t];
            const tone = currentTone(present, total, req);
            const short = total > 0 && (present * 100) / total < req;
            const more = Math.max(0, Math.ceil((total * req) / 100) - present);
            return {
                tone, short,
                pct: total ? pct3(present, total) : '—',
                width: total ? Math.min(100, (present * 100) / total) : 0,
                foot: short ? `<span class="tpill tone-bad">${more} more needed</span>` : '',
            };
        }

        function currentRow(subject, t) {
            const s = subject.code;
            const p = currentRowParts(s, t);
            const input = (k, what) => `<input class="num" type="number" min="0" inputmode="numeric" value="${ATT[s][t][k]}"
                data-s="${s}" data-t="${t}" data-k="${k}" oninput="onAttInput(this)" onfocus="this.select()"
                aria-label="${esc(subject.name)} ${TYPE_LABELS[t]} ${what}">`;
            return `<div class="trow" id="cr_${s}_${t}">
                <div class="trow-top">
                    <span class="tlabel">${TYPE_LABELS[t]} <span class="need">need ${THRESHOLDS[t]}%</span><span class="short-tag"${p.short ? '' : ' hidden'}>SHORT</span></span>
                    <span class="tval">${input('present', 'present')}<span class="slash">/</span>${input('total', 'held')}
                        <span class="tpct mono tone-${p.tone}">${p.pct}</span></span>
                </div>
                <div class="bar"><div class="fill tone-${p.tone}" style="width:${p.width}%"></div></div>
                <div class="tfoot">${p.foot}</div>
            </div>`;
        }

        function updateCurrentRow(s, t) {
            const row = document.getElementById(`cr_${s}_${t}`);
            if (!row) return;
            const p = currentRowParts(s, t);
            const pct = row.querySelector('.tpct');
            pct.textContent = p.pct;
            pct.className = `tpct mono tone-${p.tone}`;
            const fill = row.querySelector('.fill');
            fill.className = `fill tone-${p.tone}`;
            fill.style.width = `${p.width}%`;
            row.querySelector('.short-tag').hidden = !p.short;
            row.querySelector('.tfoot').innerHTML = p.foot;
        }

        function onAttInput(el) {
            const { s, t, k } = el.dataset;
            ATT[s][t][k] = Math.max(0, parseInt(el.value) || 0);
            updateCurrentRow(s, t);
            saveToStorage();
            renderPlan();
        }

        // Every subject, in Subjects-sheet order: this page can't know a subject's attendance
        // until you type it in, so none are hidden here.
        function renderCurrent() {
            document.getElementById('currentCards').innerHTML =
                SUBJECTS.map(x => subjectCard(x, 'current', TYPES.map(t => currentRow(x, t)).join(''))).join('');
        }

        // PROJECTED — your numbers + the rest of the timetable − the days you mark off.
        function projectedRow(d, t) {
            const has = d.total > 0;
            const tone = projTone(d.buffer);
            const pill = d.buffer < 0 ? `${Math.abs(d.buffer)} short` : `+${d.buffer} buffer`;
            return `<div class="trow">
                <div class="trow-top">
                    <span class="tlabel">${TYPE_LABELS[t]} <span class="need">need ${d.req}%</span>${has && d.buffer < 0 ? '<span class="short-tag">SHORT</span>' : ''}</span>
                    ${has ? `<span class="tval"><b class="mono">${d.present}/${d.total}</b><span class="tpct mono tone-${tone}">${pct3(d.present, d.total)}</span></span>`
                    : '<span class="none">no classes</span>'}
                </div>
                ${has ? `<div class="bar"><div class="fill tone-${tone}" style="width:${Math.min(100, (d.present * 100) / d.total)}%"></div></div>
                <div class="tfoot"><span class="tpill tone-${tone}">${pill}</span></div>` : ''}
            </div>`;
        }

        // ============================================================
        // RENDER: Plan holidays (legend + calendar) and Projected attendance
        // ============================================================
        function renderPlan() {
            const root = document.getElementById('planRoot');
            if (needsBatch()) {
                const missing = PLANNER.batchGroups.filter(g => !g.options.includes(picks[g.id])).map(g => `<strong>${esc(g.label)}</strong>`).join(' and ');
                root.innerHTML = `<div class="card notice">Pick your ${missing} at the top — some classes (SGT, clinical postings) differ by batch, so the calendar and projection depend on them.</div>`;
                return;
            }
            const shown = activeSubjects();
            const userHols = [...holidays].filter(iso => !BY_ISO[iso]?.fixed).length;
            const proj = projectAttendance();
            root.innerHTML = `
                <div class="sec-head">
                    <div class="eyebrow">Plan holidays</div>
                    <div class="legend">
                        ${shown.map(x => `<span class="leg"><span class="sw" style="background:${x.color}"></span>${esc(x.name)}</span>`).join('')}
                        <span class="leg"><span class="sw" style="background:var(--bad)"></span>Holiday</span>
                        <span class="leg"><span class="sw" style="background:var(--fixed)"></span>Fixed</span>
                        <span>· ${userHols} selected</span>
                        <button class="sm" onclick="toggleDetails()" aria-pressed="${showDetails}"
                            title="What each SGT / L count is made of (DOAP, SGD, SEM, SDL …)">${showDetails ? 'Hide' : 'Show'} class details</button>
                    </div>
                </div>
                <div id="calendarRoot"></div>
                <div class="sec-head"><div class="eyebrow">Projected attendance — after selected holidays</div></div>
                <div class="grid">${shown.map(x => subjectCard(x, 'projected', TYPES.map(t => projectedRow(proj[x.code][t], t)).join(''))).join('')}</div>`;
            renderCalendar();
        }

        // A subject's classes that day as counted: "L×1 SGT×2". With details, what each count is
        // made of when it isn't just that type: "L×1 SGT×2 (DOAP)", "SGT×3 (SGT 1, DOAP 2)".
        function pillText(entries, details) {
            const by = {};
            entries.forEach(([tt, n]) => { (by[TYPE_MAP[tt] || tt] ||= []).push([tt, n]); });
            const order = Object.keys(by).sort((a, b) => TYPES.indexOf(a) - TYPES.indexOf(b));
            return order.map(as => {
                const parts = by[as];
                let text = `${as}×${parts.reduce((a, [, n]) => a + n, 0)}`;
                if (details && !(parts.length === 1 && parts[0][0] === as))
                    text += ` (${parts.map(([tt, n]) => parts.length === 1 ? tt : `${tt} ${n}`).join(', ')})`;
                return text;
            }).join(' ');
        }

        function renderDay(d, cutoff) {
            const isPast = d.iso < cutoff;
            const isOff = holidays.has(d.iso) && !d.fixed;
            const raw = dayRaw(d);
            const total = dayTotal(d);
            const isEmpty = total === 0;
            const events = d.events || [];
            const notes = d.notes || [];

            let cellClass = 'day-cell';
            if (isPast) cellClass += ' past';
            else if (d.fixed) cellClass += ' fixed';
            else if (isOff) cellClass += ' holiday';
            else if (isEmpty) cellClass += ' no-classes';

            const onclick = (isPast || d.fixed || isEmpty) ? '' : `onclick="toggleDay('${d.iso}')"`;

            let pills = '';
            SUBJECTS.forEach(({ code: s, name, color }) => {
                const t = Object.entries(raw[s] || {}).filter(([, n]) => n);
                if (!t.length) return;
                pills += `<div class="pill${showDetails ? ' wrap' : ''}" style="--c:${color}" title="${esc(`${name}: ${pillText(t, true)}`)}">${esc(s)}: ${esc(pillText(t, showDetails))}</div>`;
            });
            events.forEach(e => { pills += `<div class="pill event" title="${esc(e)} (not counted)">${esc(e)}</div>`; });
            notes.forEach(n => { pills += `<div class="day-note" title="${esc(n)}">${esc(n)}</div>`; });
            if (isEmpty && !events.length && !notes.length && !d.fixed) pills = `<span class="no-class">no classes</span>`;

            const badge = isPast ? `<span class="badge badge-past">PAST</span>`
                : d.fixed ? `<span class="badge badge-fixed">FIXED</span>`
                    : isOff ? `<span class="badge badge-off">OFF</span>` : '';
            const count = !isEmpty ? `<span class="class-count">${plural(total, 'class', 'classes')}</span>` : '';

            const title = [`${d.date} — ${plural(total, 'class', 'classes')}`, ...events, ...notes].join('\n');
            return `<div class="${cellClass}" ${onclick} title="${esc(title)}">
                <div class="day-top"><span class="day-date">${d.date}</span>${badge}</div>
                <div class="day-top"><span class="day-name">${d.day}</span>${count}</div>
                <div class="pills">${pills}</div>
            </div>`;
        }

        function renderCalendar() {
            const root = document.getElementById('calendarRoot');
            if (!root) return;
            const cutoff = getCutoffIso();
            const weeks = {};
            TIMETABLE_DATA.forEach(d => { (weeks[d.week] ||= []).push(d); });

            // Weeks that are entirely before the "Data as of" date fold away.
            const pastWeeks = PLANNER.weekOrder.filter(w => weeks[w]?.every(d => d.iso < cutoff));
            let html = `<div class="cal-tools">${pastWeeks.length
                ? `<button class="sm" onclick="togglePastWeeks()">${showPastWeeks ? 'Hide' : 'Show'} ${plural(pastWeeks.length, 'past week')}</button>` : ''}</div>`;

            PLANNER.weekOrder.forEach(wk => {
                const days = weeks[wk];
                if (!days || (!showPastWeeks && pastWeeks.includes(wk))) return;
                html += `<div class="week-block"><div class="week-title">${esc(wk)}</div><div class="days-grid">`;
                days.forEach(d => { html += renderDay(d, cutoff); });
                html += `</div></div>`;
            });
            root.innerHTML = html;
        }

        function toggleDetails() {
            showDetails = !showDetails;
            try { localStorage.setItem(DETAIL_KEY, showDetails ? '1' : '0'); } catch (e) { }
            renderPlan();
        }

        function togglePastWeeks() {
            showPastWeeks = !showPastWeeks;
            renderCalendar();
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function toggleDay(iso) {
            if (holidays.has(iso)) holidays.delete(iso);
            else holidays.add(iso);
            saveToStorage();
            renderPlan();
        }

        function resetHolidays() {
            holidays.clear();
            TIMETABLE_DATA.filter(d => d.fixed).forEach(d => holidays.add(d.iso));
            saveToStorage();
            renderPlan();
        }

        // A printable summary: your holidays, then projected and current attendance.
        function exportSummary() {
            if (needsBatch()) { showToast('Pick your batches first.'); return; }
            const proj = projectAttendance();
            const refDate = document.getElementById('refDate')?.value.trim() || todayDisplay();
            const batchText = PLANNER.batchGroups.map(g => `${g.label} ${picks[g.id]}`).join(', ');
            const userHols = [...holidays].filter(iso => !BY_ISO[iso]?.fixed).sort();
            const toneColor = { good: '#2E7D5B', warn: '#B4832A', bad: '#C4472F', neutral: '#A4A29C' };
            const shown = activeSubjects();

            const holRows = !userHols.length
                ? `<tr><td colspan="3" class="muted">No personal holidays selected.</td></tr>`
                : userHols.map(iso => {
                    const d = BY_ISO[iso];
                    const c = dayClasses(d);
                    return `<tr><td><strong>${d.date}</strong> (${d.day})</td><td>${plural(dayTotal(d), 'class', 'classes')} missed</td>
                        <td>${CODES.filter(s => sumTypes(c[s]) > 0).join(', ')}</td></tr>`;
                }).join('');

            const projRows = shown.map(({ code: s, name, color }) => TYPES.map((t, i) => {
                const d = proj[s][t];
                const head = i === 0 ? `<td rowspan="${TYPES.length}" style="color:${color};font-weight:600;vertical-align:top">${esc(name)}</td>` : '';
                if (!d.total) return `<tr>${head}<td>${TYPE_LABELS[t]}</td><td colspan="3" class="muted">no classes</td></tr>`;
                const col = toneColor[projTone(d.buffer)];
                return `<tr>${head}<td>${TYPE_LABELS[t]}</td><td style="color:${col};font-weight:600">${pct3(d.present, d.total)}</td>
                    <td>${d.present}/${d.total} (need ${d.req}%)</td><td style="color:${col}">${d.buffer < 0 ? `${-d.buffer} short` : `+${d.buffer} buffer`}</td></tr>`;
            }).join('')).join('');

            const currRows = shown.map(({ code: s, name, color }) => TYPES.map((t, i) => {
                const c = ATT[s][t];
                const head = i === 0 ? `<td rowspan="${TYPES.length}" style="color:${color};font-weight:600;vertical-align:top">${esc(name)}</td>` : '';
                if (!c.total) return `<tr>${head}<td>${TYPE_LABELS[t]}</td><td colspan="2" class="muted">no classes</td></tr>`;
                const col = toneColor[currentTone(c.present, c.total, THRESHOLDS[t])];
                return `<tr>${head}<td>${TYPE_LABELS[t]}</td><td style="color:${col};font-weight:600">${pct3(c.present, c.total)}</td>
                    <td>${c.present}/${c.total} (need ${THRESHOLDS[t]}%)</td></tr>`;
            }).join('')).join('');

            const dateStr = new Date().toLocaleDateString('en-IN', { day: 'numeric', month: 'long', year: 'numeric' });
            const html = `<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Holiday Plan Export</title>
<style>
  body { font-family: -apple-system, 'Segoe UI', Arial, sans-serif; font-size: 13px; color: #161616; padding: 32px; max-width: 820px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 500; letter-spacing: -.02em; margin-bottom: 4px; }
  .meta, .muted { color: #8A8882; }
  .meta { font-size: 12px; margin-bottom: 28px; }
  h2 { font-size: 15px; font-weight: 500; margin: 28px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 6px 8px; text-align: left; border-bottom: 1px solid #ECEAE5; }
  th { font-size: 12px; font-weight: 500; color: #8A8882; }
  @media print { body { padding: 16px; } }
</style>
</head>
<body>
  <h1>Holiday Planner — ${esc(PLANNER.label)}</h1>
  <div class="meta">Generated ${dateStr} · numbers as of ${esc(refDate)} · ${esc(batchText)}</div>
  <h2>Selected holidays</h2>
  <table><thead><tr><th>Date</th><th>Impact</th><th>Subjects</th></tr></thead><tbody>${holRows}</tbody></table>
  <h2>Projected attendance (end of term, ${esc(PLANNER.endDate)})</h2>
  <table><thead><tr><th>Subject</th><th>Type</th><th>%</th><th>Count</th><th>Margin</th></tr></thead><tbody>${projRows}</tbody></table>
  <h2>Current attendance (as of ${esc(refDate)})</h2>
  <table><thead><tr><th>Subject</th><th>Type</th><th>%</th><th>Count</th></tr></thead><tbody>${currRows}</tbody></table>
</body>
</html>`;

            const blob = new Blob([html], { type: 'text/html;charset=utf-8' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'holiday_plan.html';
            a.click();
        }

        // ============================================================
        // MAIN RENDER
        // ============================================================
        function render() {
            renderBatchRow();
            renderCurrent();
            renderPlan();
        }

        renderStatic();
        loadInitialState();
        render();
    </script>
</body>

</html>
