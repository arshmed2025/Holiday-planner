    <meta charset="UTF-8">

    <title>IDK | Holiday Planner</title>
    <script>
        // A small Thar drives along the line under the logo now and then. true = on, false = off.
        var DRIVING_THAR = true;
        if (!DRIVING_THAR) document.documentElement.classList.add('no-thar');
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

        href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400;500;600&display=swap"
        rel="stylesheet">
    <script>
        // Theme before first paint: light unless you picked Auto (follow the device) or Dark.
        (function () {
            try {
                var t = localStorage.getItem('idk_planner_theme');
                if (t === 'auto') document.documentElement.removeAttribute('data-theme');
                else if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
            } catch (e) { }
        })();
    </script>

    <!-- ============================================================
  QUICK EDIT GUIDE
  ---------------------------------------------------------------
  Same layout as the website's Planner (sis.idklabs.in → Planner), but you type your
  attendance numbers in yourself. Styled with the IDK design system as its own project,
  IDK Holiday Planner (picric yellow). The previous look is in archive/og-look/.

  1. YOUR ATTENDANCE, SGT + CP BATCH, DATE, HOLIDAYS, THEME
     → Entered in the page itself; saved in this browser.

  2. TIMETABLE, CLINICAL POSTINGS, SUBJECTS, THRESHOLDS, COLLEGE HOLIDAYS
     → Don't edit here. Edit timetables/timetable_2nd_prof.xlsx and run
       python3 scripts/make_timetable.py
       (rewrites the PLANNER block between the @generated markers below; see TIMETABLE.md).

  3. COLOURS, TYPE, BUTTONS
     → Come from the design system, pasted into the first <style> block by
       python3 scripts/sync_design_system.py   (don't edit that block by hand).
       Page layout is the second <style> block. The 21 MBBS subjects use the design
       system's subject colours; any other subject uses the workbook's colour.

  4. THE DRIVING THAR (the small silver Thar on the line under the logo)
     → On/off: DRIVING_THAR near the top of this file (true / false).
       The drawing is the design system's, copied in by sync_design_system.py.

  5. THE HOLIDAY REPORT (Download report: a PDF)
     → Made by the same code as the website Planner's report (app/src/lib/pdf/), copied
       into the @report block by:  cd app && npm run planner-report
       It loads the PDF maker (jsPDF) from the internet when you press the button.
============================================================ -->

/* ---- base.css ---- */
/* IDK Labs page basics. Import after tokens.css (and fonts.css). */

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

h1, h2, h3, h4 {
  text-wrap: balance;
}

p {
  text-wrap: pretty;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
}

::selection {
  background: var(--accent-tint);
  color: var(--ink);
}

button,
input,
select,
textarea {
  font: inherit;
  letter-spacing: inherit;
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
}

/* ---- components.css ---- */
/* IDK Labs components. Every rule reads tokens.css variables, so light/dark
   (data-theme) and project colour (data-project / data-stain) work everywhere.
   Class prefix: idk-. Used by the React components in src/ and by plain HTML. */

/* ------------------------------------------------------------ helpers */

.idk-visually-hidden {
  position: absolute !important;
  width: 1px;
  height: 1px;
  margin: -1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ------------------------------------------------------------- Button */

.idk-button {
  --_h: var(--control-md);
  --_px: 18px;
  --_icon: var(--icon-md);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  height: var(--_h);
  padding-inline: var(--_px);
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  font-family: var(--font-sans);
  font-size: 15px;
  font-weight: 500;
  line-height: 20px;
  letter-spacing: -0.005em;
  text-decoration: none;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition:
    background-color var(--duration-fast) var(--ease-out),
    border-color var(--duration-fast) var(--ease-out),
    color var(--duration-fast) var(--ease-out),
    box-shadow var(--duration-fast) var(--ease-out),
    transform var(--duration-fast) var(--ease-out);
}
.idk-button svg {
  width: var(--_icon);
  height: var(--_icon);
  flex: none;
}
.idk-button:active:not(:disabled, [aria-disabled="true"]) {
  transform: translateY(1px);
}
.idk-button:disabled,
.idk-button[aria-disabled="true"] {
  opacity: 0.45;
  cursor: not-allowed;
}
.idk-button--sm { --_h: var(--control-sm); --_px: 14px; --_icon: var(--icon-sm); font-size: 14px; }
.idk-button--lg { --_h: var(--control-lg); --_px: 26px; font-size: 16px; }
.idk-button--block { width: 100%; }

.idk-button--primary { background: var(--ink); color: var(--on-ink); }
.idk-button--primary:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 84%, var(--paper)); }

.idk-button--secondary {
  background: var(--surface);
  color: var(--ink);
  border-color: var(--line);
  box-shadow: var(--shadow-control);
}
.idk-button--secondary:hover:not(:disabled) { border-color: var(--line-strong); box-shadow: var(--shadow-hover); }

.idk-button--ghost { background: transparent; color: var(--ink); }
.idk-button--ghost:hover:not(:disabled) { background: var(--surface-sunk); }

.idk-button--tinted { background: var(--accent-tint); color: var(--accent-deep); }
.idk-button--tinted:hover:not(:disabled) { background: color-mix(in oklab, var(--accent-tint) 82%, var(--accent-mark)); }

.idk-button--critical { background: var(--critical-tint); color: var(--critical); }
.idk-button--critical:hover:not(:disabled) { border-color: var(--critical); }

.idk-button__arrow { transition: transform var(--duration) var(--ease-out); }
.idk-button:hover .idk-button__arrow { transform: translateX(3px); }

/* --------------------------------------------------------- IconButton */

.idk-icon-button {
  --_s: var(--control-md);
  display: inline-grid;
  place-items: center;
  width: var(--_s);
  height: var(--_s);
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink-muted);
  cursor: pointer;
  transition:
    background-color var(--duration-fast) var(--ease-out),
    color var(--duration-fast) var(--ease-out),
    border-color var(--duration-fast) var(--ease-out);
}
.idk-icon-button svg { width: var(--icon-md); height: var(--icon-md); }
.idk-icon-button:hover:not(:disabled) { background: var(--surface-sunk); color: var(--ink); }
.idk-icon-button:disabled { opacity: 0.45; cursor: not-allowed; }
.idk-icon-button--sm { --_s: var(--control-sm); }
.idk-icon-button--sm svg { width: var(--icon-sm); height: var(--icon-sm); }
.idk-icon-button--lg { --_s: var(--control-lg); }
.idk-icon-button--secondary {
  background: var(--surface);
  border-color: var(--line);
  color: var(--ink);
  box-shadow: var(--shadow-control);
}
.idk-icon-button--secondary:hover:not(:disabled) { background: var(--surface); border-color: var(--line-strong); }
.idk-icon-button--primary { background: var(--ink); color: var(--on-ink); }
.idk-icon-button--primary:hover:not(:disabled) { background: color-mix(in oklab, var(--ink) 84%, var(--paper)); color: var(--on-ink); }

/* ------------------------------------------------- TextField and Select */

.idk-field {
  display: grid;
  gap: var(--space-2);
  min-width: 0;
}
.idk-field__label {
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  line-height: 20px;
  color: var(--ink);
}
.idk-field__hint,
.idk-field__error {
  margin: 0;
  font-size: 14px;
  line-height: 20px;
}
.idk-field__hint { color: var(--ink-muted); }
.idk-field__error {
  display: flex;
  align-items: flex-start;
  gap: 6px;
  color: var(--critical);
  font-weight: 500;
}
.idk-field__error svg { width: var(--icon-sm); height: var(--icon-sm); flex: none; margin-top: 2px; }

.idk-control {
  position: relative;
  display: flex;
  align-items: center;
}
.idk-control__icon {
  position: absolute;
  left: 13px;
  width: var(--icon-md);
  height: var(--icon-md);
  color: var(--ink-muted);
  pointer-events: none;
}
.idk-control__icon svg { display: block; width: 100%; height: 100%; }
.idk-control__chevron {
  position: absolute;
  right: 12px;
  width: var(--icon-md);
  height: var(--icon-md);
  color: var(--ink-muted);
  pointer-events: none;
}

.idk-input,
.idk-select {
  box-sizing: border-box;
  width: 100%;
  height: var(--control-md);
  margin: 0;
  padding: 0 14px;
  border: 1px solid var(--line-control);
  border-radius: var(--radius-md);
  background: var(--surface);
  color: var(--ink);
  font-family: var(--font-sans);
  font-size: 16px;
  line-height: 24px;
  box-shadow: var(--shadow-control);
  transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out);
}
.idk-input::placeholder { color: var(--ink-faint); }
.idk-input:hover,
.idk-select:hover { border-color: var(--ink-muted); }
.idk-input:focus-visible,
.idk-select:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 1px;
  border-color: var(--ink);
}
.idk-input[aria-invalid="true"],
.idk-select[aria-invalid="true"] { border-color: var(--critical); }
.idk-input:disabled,
.idk-select:disabled { opacity: 0.5; cursor: not-allowed; }
.idk-select {
  appearance: none;
  padding-right: 40px;
  cursor: pointer;
}
.idk-control--icon .idk-input { padding-left: 42px; }
.idk-control--search .idk-input {
  height: var(--control-lg);
  padding-left: 46px;
  border-radius: var(--radius-pill);
}
.idk-control--search .idk-control__icon { left: 18px; }

/* --------------------------------------------------- Checkbox, Switch */

.idk-choice {
  display: inline-flex;
  align-items: flex-start;
  gap: var(--space-3);
  font-size: 15px;
  line-height: 22px;
  color: var(--ink);
  cursor: pointer;
}
.idk-choice__text { display: grid; }
.idk-choice__hint { font-size: 14px; line-height: 20px; color: var(--ink-muted); }

.idk-checkbox {
  appearance: none;
  flex: none;
  display: grid;
  place-items: center;
  width: 20px;
  height: 20px;
  margin: 1px 0 0;
  border: 1.5px solid var(--line-control);
  border-radius: var(--radius-xs);
  background: var(--surface);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out), border-color var(--duration-fast) var(--ease-out);
}
.idk-checkbox::before {
  content: "";
  width: 12px;
  height: 12px;
  background: var(--paper);
  clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 26%, 86% 12%, 37% 72%);
  transform: scale(0);
  transition: transform var(--duration-fast) var(--ease-out);
}
.idk-checkbox:hover { border-color: var(--ink-muted); }
.idk-checkbox:checked { background: var(--accent-mark); border-color: var(--accent-mark); }
.idk-checkbox:checked::before { transform: scale(1); }
.idk-checkbox:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.idk-checkbox:disabled { opacity: 0.45; cursor: not-allowed; }

.idk-switch {
  appearance: none;
  position: relative;
  flex: none;
  width: 40px;
  height: 24px;
  margin: 0;
  border: 1.5px solid var(--line-control);
  border-radius: var(--radius-pill);
  background: var(--surface-sunk);
  cursor: pointer;
  transition: background-color var(--duration) var(--ease-out), border-color var(--duration) var(--ease-out);
}
.idk-switch::before {
  content: "";
  position: absolute;
  top: 2px;
  left: 2px;
  width: 17px;
  height: 17px;
  border-radius: 50%;
  background: var(--ink-muted);
  transition: transform var(--duration) var(--ease-out), background-color var(--duration) var(--ease-out);
}
.idk-switch:checked { background: var(--accent-mark); border-color: var(--accent-mark); }
.idk-switch:checked::before { transform: translateX(16px); background: var(--paper); }
.idk-switch:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.idk-switch:disabled { opacity: 0.45; cursor: not-allowed; }

/* --------------------------------------------------- SegmentedControl */

.idk-segmented {
  display: inline-flex;
  gap: 2px;
  padding: 3px;
  border: 1px solid var(--line);
  border-radius: var(--radius-pill);
  background: var(--surface-sunk);
  max-width: 100%;
  overflow-x: auto;
  scrollbar-width: none;
}
.idk-segmented--block { display: flex; }
.idk-segmented__item {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  flex: none;
  height: 32px;
  padding: 0 14px;
  border: 0;
  border-radius: var(--radius-pill);
  background: transparent;
  color: var(--ink-muted);
  font-family: var(--font-sans);
  font-size: 14px;
  font-weight: 500;
  line-height: 20px;
  white-space: nowrap;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out), color var(--duration-fast) var(--ease-out);
}
.idk-segmented--block .idk-segmented__item { flex: 1; }
.idk-segmented__item svg { width: var(--icon-sm); height: var(--icon-sm); }
.idk-segmented__item:hover { color: var(--ink); }
.idk-segmented__item[aria-checked="true"] {
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 0 0 1px var(--line), var(--shadow-control);
}
.idk-segmented__item:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

/* ---------------------------------------------------------------- Tag */

.idk-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 26px;
  padding: 0 10px;
  border-radius: var(--radius-pill);
  background: var(--surface-sunk);
  color: var(--ink-muted);
  font-family: var(--font-sans);
  font-size: 13px;
  font-weight: 500;
  line-height: 16px;
  white-space: nowrap;
}
.idk-tag svg { width: 14px; height: 14px; flex: none; }
.idk-tag--sm { height: 22px; padding: 0 8px; font-size: 12px; }
.idk-tag--accent { background: var(--accent-tint); color: var(--accent-deep); }
.idk-tag--outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-strong); }
.idk-tag--positive { background: var(--positive-tint); color: var(--positive); }
.idk-tag--caution { background: var(--caution-tint); color: var(--caution); }
.idk-tag--critical { background: var(--critical-tint); color: var(--critical); }
.idk-tag__dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; }
.idk-tag--accent .idk-tag__dot { background: var(--accent-mark); }

/* --------------------------------------------------------------- Card */

.idk-card {
  display: grid;
  gap: var(--space-3);
  align-content: start;
  padding: var(--space-6);
  border: 1px solid var(--line);
  border-radius: var(--radius-lg);
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
}
.idk-card--sunk { background: var(--surface-sunk); border-color: transparent; }
a.idk-card,
.idk-card--interactive {
  cursor: pointer;
  transition:
    border-color var(--duration) var(--ease-out),
    box-shadow var(--duration) var(--ease-out),
    transform var(--duration) var(--ease-out);
}
a.idk-card:hover,
.idk-card--interactive:hover {
  border-color: var(--line-strong);
  box-shadow: var(--shadow-hover);
  transform: translateY(-2px);
}
.idk-card__title { margin: 0; font-size: 20px; font-weight: 500; line-height: 28px; letter-spacing: -0.015em; }
.idk-card__description { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }

/* -------------------------------------------------------- ColourBlock */

.idk-block {
  container-type: inline-size;
  position: relative;
  overflow: hidden;
  padding: var(--space-8);
  border-radius: var(--radius-xl);
  background: var(--accent-tint);
  color: var(--accent-deep);
}
.idk-block__inner {
  display: grid;
  gap: var(--space-6);
  align-items: center;
}
.idk-block__text { display: grid; gap: var(--space-3); align-content: start; }
.idk-block__eyebrow {
  margin: 0;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}
.idk-block__title {
  margin: 0;
  font-size: 28px;
  font-weight: 500;
  line-height: 34px;
  letter-spacing: -0.025em;
}
.idk-block__body { margin: 0; font-size: 16px; line-height: 24px; max-width: 52ch; }
.idk-block__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-2); }
.idk-block__media {
  min-width: 0;
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-float);
}
@container (min-width: 720px) {
  .idk-block--split .idk-block__inner { grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: var(--space-10); }
}
@media (max-width: 640px) {
  .idk-block { padding: var(--space-6); }
  .idk-block__title { font-size: 24px; line-height: 30px; }
}

/* -------------------------------------------------------- ProjectCard */

.idk-project-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
  min-height: 248px;
  padding: var(--space-6);
  border: 1px solid var(--line);
  border-radius: var(--radius-xl);
  background: var(--surface);
  color: var(--ink);
  text-decoration: none;
  transition:
    transform var(--duration) var(--ease-out),
    box-shadow var(--duration) var(--ease-out),
    border-color var(--duration) var(--ease-out);
}
.idk-project-card:hover {
  transform: translateY(-4px);
  border-color: var(--line-strong);
  box-shadow: var(--shadow-hover);
}
.idk-project-card__name { margin: 0; font-size: 20px; font-weight: 500; line-height: 28px; letter-spacing: -0.015em; }
.idk-project-card__description { margin: 6px 0 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.idk-project-card__open {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: auto;
  font-family: var(--font-mono);
  font-size: 12px;
  font-weight: 500;
  line-height: 16px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-muted);
  transition: color var(--duration) var(--ease-out);
}
.idk-project-card__open svg { width: 14px; height: 14px; transition: transform var(--duration) var(--ease-out); }
.idk-project-card:hover .idk-project-card__open { color: var(--accent-deep); }
.idk-project-card:hover .idk-project-card__open svg { transform: translate(2px, -2px); }

/* --------------------------------------------------------------- Stat */

.idk-stat { display: grid; gap: 4px; align-content: start; }
.idk-stat__label { margin: 0; font-size: 14px; font-weight: 500; line-height: 20px; color: var(--ink-muted); }
.idk-stat__value {
  margin: 0;
  font-size: 44px;
  font-weight: 450;
  line-height: 48px;
  letter-spacing: -0.04em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.idk-stat__unit { margin-left: 4px; font-size: 0.45em; letter-spacing: -0.01em; color: var(--ink-muted); }
.idk-stat__foot { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2); font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.idk-stat__delta { display: inline-flex; align-items: center; gap: 4px; font-weight: 500; }
.idk-stat__delta svg { width: 14px; height: 14px; }
.idk-stat__delta--positive { color: var(--positive); }
.idk-stat__delta--critical { color: var(--critical); }
.idk-stat__delta--neutral { color: var(--ink-muted); }

/* ------------------------------------------------------ List, ListRow */

.idk-list { margin: 0; padding: 0; list-style: none; border-top: 1px solid var(--line); }
.idk-list > li { border-bottom: 1px solid var(--line); }
.idk-row {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  width: 100%;
  min-height: 60px;
  padding: 12px 8px;
  border: 0;
  border-radius: var(--radius-sm);
  background: transparent;
  color: var(--ink);
  font: inherit;
  text-align: left;
  text-decoration: none;
}
a.idk-row,
button.idk-row {
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-out);
}
a.idk-row:hover,
button.idk-row:hover { background: var(--surface-sunk); }
.idk-row__lead {
  flex: none;
  display: grid;
  place-items: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-sm);
  background: var(--accent-tint);
  color: var(--accent-deep);
}
.idk-row__lead svg { width: var(--icon-md); height: var(--icon-md); }
.idk-row__text { flex: 1; min-width: 0; }
.idk-row__title { display: block; margin: 0; font-size: 15px; font-weight: 500; line-height: 22px; overflow-wrap: anywhere; }
.idk-row__meta { display: block; margin: 2px 0 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }
.idk-row__trail {
  flex: none;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  color: var(--ink-muted);
  font-family: var(--font-mono);
  font-size: 13px;
  line-height: 18px;
  font-variant-numeric: tabular-nums;
}
.idk-row__trail > svg { width: var(--icon-sm); height: var(--icon-sm); }

/* ------------------------------------------------------------- Notice */

.idk-notice {
  display: grid;
  grid-template-columns: auto minmax(0, 1fr);
  column-gap: var(--space-3);
  row-gap: 2px;
  padding: var(--space-4) var(--space-5);
  border-radius: var(--radius-md);
  background: var(--surface-sunk);
  color: var(--ink);
}
.idk-notice__icon { grid-row: 1 / span 3; width: var(--icon-md); height: var(--icon-md); margin-top: 1px; color: var(--ink-muted); }
.idk-notice__icon svg { display: block; width: 100%; height: 100%; }
.idk-notice__title { margin: 0; font-size: 15px; font-weight: 500; line-height: 22px; }
.idk-notice__body { margin: 0; font-size: 14px; line-height: 20px; color: var(--ink-muted); }
.idk-notice__actions { display: flex; flex-wrap: wrap; gap: var(--space-2); margin-top: var(--space-3); }
.idk-notice--positive { background: var(--positive-tint); }
.idk-notice--caution { background: var(--caution-tint); }
.idk-notice--critical { background: var(--critical-tint); }
.idk-notice--positive .idk-notice__icon, .idk-notice--positive .idk-notice__title { color: var(--positive); }
.idk-notice--caution .idk-notice__icon, .idk-notice--caution .idk-notice__title { color: var(--caution); }
.idk-notice--critical .idk-notice__icon, .idk-notice--critical .idk-notice__title { color: var(--critical); }
.idk-notice--positive .idk-notice__body,
.idk-notice--caution .idk-notice__body,
.idk-notice--critical .idk-notice__body { color: var(--ink); }

/* ----------------------------------------------------------- Progress */

.idk-progress { display: grid; gap: var(--space-2); }
.idk-progress__head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-3); }
.idk-progress__label { font-size: 14px; font-weight: 500; line-height: 20px; color: var(--ink); }
.idk-progress__value { font-family: var(--font-mono); font-size: 13px; line-height: 20px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }
.idk-progress__track {
  height: 8px;
  overflow: hidden;
  border-radius: var(--radius-pill);
  background: var(--surface-sunk);
  box-shadow: inset 0 0 0 1px var(--line);
}
.idk-progress__fill {
  height: 100%;
  border-radius: inherit;
  background: var(--accent-mark);
  transition: width var(--duration-slow) var(--ease-out);
}
.idk-progress--positive .idk-progress__fill { background: var(--positive); }
.idk-progress--caution .idk-progress__fill { background: var(--caution); }
.idk-progress--critical .idk-progress__fill { background: var(--critical); }
.idk-progress__hint { margin: 0; font-size: 13px; line-height: 18px; color: var(--ink-muted); }

/* --------------------------------------------------------- EmptyState */

.idk-empty {
  display: grid;
  justify-items: center;
  gap: var(--space-3);
  padding: var(--space-12) var(--space-6);
  text-align: center;
}
.idk-empty .idk-cell { color: var(--accent-mark); margin-bottom: var(--space-2); }
.idk-empty__title { margin: 0; font-size: 20px; font-weight: 500; line-height: 28px; letter-spacing: -0.015em; color: var(--ink); }
.idk-empty__body { margin: 0; max-width: 42ch; font-size: 15px; line-height: 22px; color: var(--ink-muted); }
.idk-empty__actions { display: flex; flex-wrap: wrap; justify-content: center; gap: var(--space-2); margin-top: var(--space-3); }

/* ------------------------------------------------------------- NavBar */

.idk-nav {
  position: sticky;
  top: 0;
  z-index: 40;
  font-family: var(--font-sans);
}
.idk-nav__bar {
  box-sizing: border-box;
  display: flex;
  align-items: center;
  gap: var(--space-4);
  height: 64px;
  padding-inline: var(--space-6);
  background: color-mix(in oklab, var(--paper) 86%, transparent);
  backdrop-filter: saturate(160%) blur(14px);
  -webkit-backdrop-filter: saturate(160%) blur(14px);
  border-bottom: 1px solid var(--line);
}
.idk-nav--floating { top: 12px; padding-inline: var(--space-4); }
.idk-nav--floating .idk-nav__bar {
  max-width: 1040px;
  height: 60px;
  margin: 12px auto 0;
  padding: 0 10px 0 20px;

/* -------------------------------------------------------------- Pulse */
/* The ECG signature from the MBBS Archive and Student Dashboard. Each path
   draws itself via dashoffset. Monitor effect: after the draw, the trace dims
   to a phosphor ghost and a comet (7 phase-lagged copies of one combined
   path, pathLength=1000) sweeps it forever. Dash period is 2000 (30 bead +
   1970 gap): one 2.4s lap is exactly one period, so the loop is seamless.
   The comet path must be a single subpath: Chrome paints dashes wrong on
   pathLength-normalised multi-subpath geometry. */

.idk-pulse { display: block; overflow: visible; color: var(--accent-mark); }
.idk-pulse-auto--narrow { display: block; }
.idk-pulse-auto--wide { display: none; }

  to { stroke-dashoffset: 0; }

@keyframes idk-ecg-dim {

}
@keyframes idk-ecg-comet {
  from { stroke-dashoffset: 2056; }
  to { stroke-dashoffset: 56; }
}
.idk-pulse__line {
  stroke-dasharray: 300;
  animation: idk-ecg 1.5s ease-out both;

.idk-pulse__line--monitor {

  animation-timing-function: ease-out, ease-in-out;
  animation-fill-mode: both, both;

.idk-pulse__comet {

.idk-tile {

            border: 1px solid var(--line);
            border-radius: var(--radius-md);
            background: var(--surface);
            cursor: pointer;
            user-select: none;
            transition: border-color var(--duration-fast) var(--ease-out), box-shadow var(--duration-fast) var(--ease-out), transform var(--duration-fast) var(--ease-out);
            -webkit-tap-highlight-color: transparent;
        }

        .day-cell:not(.fixed):not(.past):not(.no-classes):hover {
            border-color: var(--line-strong);
            box-shadow: var(--shadow-hover);
            transform: translateY(-1px);
        }

        .day-cell.no-classes {
            background: transparent;
            border-style: dashed;
            cursor: default;
        }

        .day-cell.holiday {
            background: var(--critical-tint);
            border-color: color-mix(in oklab, var(--critical) 40%, transparent);
        }

        .day-cell.fixed {
            background: var(--caution-tint);
            border-color: color-mix(in oklab, var(--caution) 30%, transparent);
            cursor: default;
        }

        .day-cell.past {
            background: var(--surface-sunk);
            border-color: transparent;
            cursor: default;
            opacity: .55;
        }

        .day-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .day-date {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--ink-faint);
        }

        .day-name {
            font-size: 14px;
            font-weight: 500;
        }

        .class-count {
            font-size: 10px;
            color: var(--ink-muted);
        }

        .badge {
            font-family: var(--font-mono);
            font-size: 9px;
            font-weight: 500;
            letter-spacing: .06em;
            text-transform: uppercase;
            padding: 1px 6px;
            border-radius: var(--radius-pill);
        }

        .badge-off {
            background: color-mix(in oklab, var(--critical) 14%, transparent);
            color: var(--critical);
        }

        .badge-fixed {
            background: color-mix(in oklab, var(--caution) 14%, transparent);
            color: var(--caution);
        }

        .badge-past {
            background: var(--line);
            color: var(--ink-muted);
        }

        .pills {
            display: flex;
            flex-direction: column;
            gap: 4px;
            flex: 1;
            margin-top: 2px;
        }

        /* a subject's classes that day: ink on a tint of its colour */
        .pill {
            font-family: var(--font-mono);
            font-size: 10px;
            font-weight: 500;
            padding: 2px 6px;
            border-radius: var(--radius-xs);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--ink);
            background: color-mix(in oklab, var(--c) 20%, var(--surface));
        }

        /* "Class details": the longer pills wrap instead of cutting off */
        .pill.wrap {
            white-space: normal;
            line-height: 1.3;
        }

        /* FA / UHV: shown, not counted */
        .pill.event {
            font-family: var(--font-sans);
            color: var(--ink-muted);
            background: transparent;
            border: 1px dashed var(--line-strong);
        }

        /* Notes from the workbook ("Not sure: …"), shown in full */
        .day-note {
            font-size: 10px;
            font-style: italic;
            line-height: 1.3;
            color: var(--caution);
            overflow-wrap: anywhere;
        }

        .no-class {
            font-size: 10px;
            color: var(--ink-faint);
        }

        #toast {
            position: fixed;
            left: 50%;
            bottom: 24px;
            transform: translateX(-50%) translateY(80px);
            padding: 10px 18px;
            border-radius: var(--radius-pill);
            background: var(--ink);
            color: var(--on-ink);
            box-shadow: var(--shadow-float);
            font-size: 14px;
            opacity: 0;
            transition: opacity var(--duration) var(--ease-out), transform var(--duration) var(--ease-out);
            z-index: 9999;
            white-space: nowrap;
            pointer-events: none;
        }

        /* ---- The driving Thar: small, along the hairline under the logo. It crosses slowly,
                waits off the right edge, repeats. At night its headlamps and tail lamps are on
                (their colours, --land-lamp-glow and --land-beacon, are clear by day).
                On/off: DRIVING_THAR at the top of this file. ---- */
        /* paint: a light silver, so the small car's shape (its dark roof, glass and tyres) reads
           clearly on either page colour */
        .driving-thar {
            --car: 46px;
            --drive-paint: #adb3bb;
            --drive-shine: #d9dde2;
            --drive-shade: #7f868f;
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22px;
            overflow: hidden;
            pointer-events: none;
        }

        .driving-thar__track {
            position: absolute;
            inset: 0;
            animation: thar-drive 44s linear infinite;
        }

        .driving-thar__car {
            position: absolute;
            right: 100%;
            bottom: 0;
            width: var(--car);
        }

        .driving-thar__car svg {
            display: block;
            width: 100%;
            height: auto;
        }

        /* the lamps' layers sit exactly over the car; the beam reaches a car length past it */
        .driving-thar__car .driving-thar__lights {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .driving-thar__wheel {
            transform-box: fill-box;
            transform-origin: center;
            animation: thar-roll .45s linear infinite;
        }

        @keyframes thar-drive {
            0% {
                transform: translateX(0);
            }

            45%,
            100% {
                transform: translateX(calc(100% + var(--car)));
            }
        }

        @keyframes thar-roll {
            to {
                transform: rotate(360deg);
            }
        }

        .no-thar .driving-thar {
            display: none;
        }

        @media (prefers-reduced-motion: reduce) {
            .driving-thar {
                display: none;
            }
        }

        /* ---- Responsive ---- */
        @media (max-width: 980px) {
            .grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
            }

            .days-grid {
                grid-template-columns: repeat(4, minmax(0, 1fr));
            }
        }

        @media (max-width: 640px) {
            .page {
                padding: 20px 16px 64px;
            }

            .brand-row {
                margin-bottom: 28px;
            }

            .grid {
                grid-template-columns: 1fr;
            }

            .days-grid {
                grid-template-columns: repeat(2, minmax(0, 1fr));
                gap: 6px;
            }

            .day-cell {
                min-height: 92px;
            }

        }
    </style>
</head>

            const row = document.getElementById('batchRow');
            row.classList.toggle('missing', needsBatch());
            row.innerHTML = PLANNER.batchGroups.map(g => `
                <span class="lab">${esc(g.label)}</span>
                <span class="idk-segmented" role="radiogroup" aria-label="${esc(g.label)}">${g.options.map(o =>
                `<button type="button" role="radio" aria-checked="${picks[g.id] === o}" class="idk-segmented__item"
                    onclick="chooseBatch('${g.id}','${o}')">${esc(o)}</button>`).join('')}</span>`).join('');
        }

        function chooseBatch(groupId, option) {
            picks = { ...picks, [groupId]: option };
            saveToStorage();
            render();
        }

        // ============================================================
        // RENDER: subject cards (same layout as the website's Planner)
        // ============================================================
        function subjectCard(subject, mode, rows) {
            const { name, code } = subject;
            return `<div class="card subj">
                <div class="subj-head"><span class="idk-subject-badge" style="--_c:${uiColor(subject)}" aria-hidden="true">${esc(code)}</span><h3 title="${esc(name)}">${esc(name)}</h3><span class="mode">${mode}</span></div>
                ${rows}
            </div>`;
        }

        // CURRENT — your numbers, typed into the card. When it's short, the footer's "N more needed"
        // pill says so (the number boxes leave no room for a "Short" tag beside the label). Updating a row on input leaves the boxes alone,
        // so typing never loses focus.
        function currentRowParts(s, t) {
            const { present, total } = ATT[s][t];
            const req = THRESHOLDS[t];
            const tone = currentTone(present, total, req);
            const short = total > 0 && (present * 100) / total < req;
            const more = Math.max(0, Math.ceil((total * req) / 100) - present);
            return {
                tone, short,
                pct: total ? pct3(present, total) : '—',
                width: total ? Math.min(100, (present * 100) / total) : 0,
                foot: short ? `<span class="tpill tone-bad">${more} more needed</span>` : '',
            };
        }

        function currentRow(subject, t) {
            const s = subject.code;
            const p = currentRowParts(s, t);
            const input = (k, what) => `<input class="num" type="number" min="0" inputmode="numeric" value="${ATT[s][t][k]}"
                data-s="${s}" data-t="${t}" data-k="${k}" oninput="onAttInput(this)" onfocus="this.select()"
                aria-label="${esc(subject.name)} ${TYPE_LABELS[t]} ${what}">`;
            return `<div class="trow" id="cr_${s}_${t}">
                <div class="trow-top">
                    <span class="tlabel">${TYPE_LABELS[t]} <span class="need">need ${THRESHOLDS[t]}%</span></span>
                    <span class="tval">${input('present', 'present')}<span class="slash">/</span>${input('total', 'held')}
                        <span class="tpct mono tone-${p.tone}">${p.pct}</span></span>
                </div>
                <div class="bar"><div class="fill tone-${p.tone}" style="width:${p.width}%"></div></div>
                <div class="tfoot">${p.foot}</div>
            </div>`;
        }

        function updateCurrentRow(s, t) {
            const row = document.getElementById(`cr_${s}_${t}`);
            if (!row) return;
            const p = currentRowParts(s, t);
            const pct = row.querySelector('.tpct');
            pct.textContent = p.pct;
            pct.className = `tpct mono tone-${p.tone}`;
            const fill = row.querySelector('.fill');
            fill.className = `fill tone-${p.tone}`;
            fill.style.width = `${p.width}%`;
            row.querySelector('.tfoot').innerHTML = p.foot;
        }

        function onAttInput(el) {
            const { s, t, k } = el.dataset;
            ATT[s][t][k] = Math.max(0, parseInt(el.value) || 0);
            updateCurrentRow(s, t);
            saveToStorage();
            renderPlan();
        }

        // Every subject, in Subjects-sheet order: this page can't know a subject's attendance
        // until you type it in, so none are hidden here.
        function renderCurrent() {
            document.getElementById('currentCards').innerHTML =
                SUBJECTS.map(x => subjectCard(x, 'current', TYPES.map(t => currentRow(x, t)).join(''))).join('');
        }

        // PROJECTED — your numbers + the rest of the timetable − the days you mark off.
        function projectedRow(d, t) {
            const has = d.total > 0;
            const tone = projTone(d.buffer);
            const pill = d.buffer < 0 ? `${Math.abs(d.buffer)} short` : `+${d.buffer} buffer`;
            return `<div class="trow">
                <div class="trow-top">
                    <span class="tlabel">${TYPE_LABELS[t]} <span class="need">need ${d.req}%</span>${has && d.buffer < 0 ? '<span class="short-tag">Short</span>' : ''}</span>
                    ${has ? `<span class="tval"><b class="mono">${d.present}/${d.total}</b><span class="tpct mono tone-${tone}">${pct3(d.present, d.total)}</span></span>`
                    : '<span class="none">no classes</span>'}
                </div>
                ${has ? `<div class="bar"><div class="fill tone-${tone}" style="width:${Math.min(100, (d.present * 100) / d.total)}%"></div></div>
                <div class="tfoot"><span class="tpill tone-${tone}">${pill}</span></div>` : ''}
            </div>`;
        }

        // ============================================================
        // RENDER: Plan holidays (legend + calendar) and Projected attendance
        // ============================================================
        function renderPlan() {
            const root = document.getElementById('planRoot');
            if (needsBatch()) {
                const missing = PLANNER.batchGroups.filter(g => !g.options.includes(picks[g.id])).map(g => `<strong>${esc(g.label)}</strong>`).join(' and ');
                root.innerHTML = `<div class="card notice">Pick your ${missing} at the top — some classes (SGT, clinical postings) differ by batch, so the calendar and projection depend on them.</div>`;
                return;
            }
            const shown = activeSubjects();
            const userHols = [...holidays].filter(iso => !BY_ISO[iso]?.fixed).length;
            const proj = projectAttendance();
            root.innerHTML = `
                <div class="sec-head">
                    <div class="eyebrow">Plan holidays</div>
                    <label class="idk-choice" title="What each SGT / L count is made of (DOAP, SGD, SEM, SDL …)">
                        <input type="checkbox" role="switch" class="idk-switch" ${showDetails ? 'checked' : ''} onchange="toggleDetails()">
                        <span class="idk-choice__text"><span>Class details</span></span>
                    </label>
                </div>
                <div class="legend">
                    ${shown.map(x => `<span class="leg"><span class="sw" style="background:${uiColor(x)}"></span>${esc(x.name)}</span>`).join('')}
                    <span class="leg"><span class="sw" style="background:var(--critical)"></span>Holiday</span>
                    <span class="leg"><span class="sw" style="background:var(--caution)"></span>Fixed</span>
                    <span class="mono">${userHols} selected</span>
                </div>
                <div id="calendarRoot"></div>
                <div class="sec-head"><div class="eyebrow">Projected attendance, after selected holidays</div></div>
                <div class="grid">${shown.map(x => subjectCard(x, 'projected', TYPES.map(t => projectedRow(proj[x.code][t], t)).join(''))).join('')}</div>`;
            renderCalendar();
        }

        // A subject's classes that day as counted: "L×1 SGT×2". With details, what each count is
        // made of when it isn't just that type: "L×1 SGT×2 (DOAP)", "SGT×3 (SGT 1, DOAP 2)".
        function pillText(entries, details) {
            const by = {};
            entries.forEach(([tt, n]) => { (by[TYPE_MAP[tt] || tt] ||= []).push([tt, n]); });
            const order = Object.keys(by).sort((a, b) => TYPES.indexOf(a) - TYPES.indexOf(b));
            return order.map(as => {
                const parts = by[as];
                let text = `${as}×${parts.reduce((a, [, n]) => a + n, 0)}`;
                if (details && !(parts.length === 1 && parts[0][0] === as))
                    text += ` (${parts.map(([tt, n]) => parts.length === 1 ? tt : `${tt} ${n}`).join(', ')})`;
                return text;
            }).join(' ');
        }

        function renderDay(d, cutoff) {
            const isPast = d.iso < cutoff;
            const isOff = holidays.has(d.iso) && !d.fixed;
            const raw = dayRaw(d);
            const total = dayTotal(d);
            const isEmpty = total === 0;
            const events = d.events || [];
            const notes = d.notes || [];

            let cellClass = 'day-cell';
            if (isPast) cellClass += ' past';
            else if (d.fixed) cellClass += ' fixed';
            else if (isOff) cellClass += ' holiday';
            else if (isEmpty) cellClass += ' no-classes';

            const onclick = (isPast || d.fixed || isEmpty) ? '' : `onclick="toggleDay('${d.iso}')"`;

            let pills = '';
            SUBJECTS.forEach(subject => {
                const { code: s, name } = subject;
                const t = Object.entries(raw[s] || {}).filter(([, n]) => n);
                if (!t.length) return;
                pills += `<div class="pill${showDetails ? ' wrap' : ''}" style="--c:${uiColor(subject)}" title="${esc(`${name}: ${pillText(t, true)}`)}">${esc(s)}: ${esc(pillText(t, showDetails))}</div>`;
            });
            events.forEach(e => { pills += `<div class="pill event" title="${esc(e)} (not counted)">${esc(e)}</div>`; });
            notes.forEach(n => { pills += `<div class="day-note" title="${esc(n)}">${esc(n)}</div>`; });
            if (isEmpty && !events.length && !notes.length && !d.fixed) pills = `<span class="no-class">no classes</span>`;

            const badge = isPast ? `<span class="badge badge-past">PAST</span>`
                : d.fixed ? `<span class="badge badge-fixed">FIXED</span>`
                    : isOff ? `<span class="badge badge-off">OFF</span>` : '';
            const count = !isEmpty ? `<span class="class-count">${plural(total, 'class', 'classes')}</span>` : '';

            const title = [`${d.date} — ${plural(total, 'class', 'classes')}`, ...events, ...notes].join('\n');
            return `<div class="${cellClass}" ${onclick} title="${esc(title)}">
                <div class="day-top"><span class="day-date">${d.date}</span>${badge}</div>
                <div class="day-top"><span class="day-name">${d.day}</span>${count}</div>
                <div class="pills">${pills}</div>
            </div>`;
        }

        function renderCalendar() {
            const root = document.getElementById('calendarRoot');
            if (!root) return;
            const cutoff = getCutoffIso();
            const weeks = {};
            TIMETABLE_DATA.forEach(d => { (weeks[d.week] ||= []).push(d); });

            // Weeks that are entirely before the "Data as of" date fold away.
            const pastWeeks = PLANNER.weekOrder.filter(w => weeks[w]?.every(d => d.iso < cutoff));
            let html = `<div class="cal-tools">${pastWeeks.length
                ? `<button type="button" class="idk-button idk-button--secondary idk-button--sm" onclick="togglePastWeeks()">${showPastWeeks ? 'Hide' : 'Show'} ${plural(pastWeeks.length, 'past week')}</button>` : ''}</div>`;

            PLANNER.weekOrder.forEach(wk => {
                const days = weeks[wk];
                if (!days || (!showPastWeeks && pastWeeks.includes(wk))) return;
                html += `<div class="week-block"><div class="week-title">${esc(wk)}</div><div class="days-grid">`;
                days.forEach(d => { html += renderDay(d, cutoff); });
                html += `</div></div>`;
            });
            root.innerHTML = html;
        }

        function toggleDetails() {
            showDetails = !showDetails;
            try { localStorage.setItem(DETAIL_KEY, showDetails ? '1' : '0'); } catch (e) { }
            renderPlan();
        }

        // Theme: Auto (follow the device), Light (default) or Dark, remembered in this browser.
        const THEME_KEY = 'idk_planner_theme';
        function setTheme(choice) {
            const root = document.documentElement;
            if (choice === 'auto') root.removeAttribute('data-theme');
            else root.setAttribute('data-theme', choice);
            try { localStorage.setItem(THEME_KEY, choice); } catch (e) { }
            document.querySelectorAll('#themeSwitch [data-theme-choice]').forEach(b =>
                b.setAttribute('aria-checked', String(b.dataset.themeChoice === choice)));
        }
        function savedTheme() {
            try { return localStorage.getItem(THEME_KEY) || 'light'; } catch (e) { return 'light'; }
        }

        function togglePastWeeks() {
            showPastWeeks = !showPastWeeks;
            renderCalendar();
        }

        // ============================================================
        // ACTIONS
        // ============================================================
        function toggleDay(iso) {
            if (holidays.has(iso)) holidays.delete(iso);
            else holidays.add(iso);
            saveToStorage();
            renderPlan();
        }

        function resetHolidays() {
            holidays.clear();
            TIMETABLE_DATA.filter(d => d.fixed).forEach(d => holidays.add(d.iso));
            saveToStorage();
            renderPlan();
        }

        // The holiday report: a PDF in the design system, made by the same code as the website
        // Planner's (window.IDKReport, from app/src/lib/pdf). Days off from the "Data as of" date on.
        function reportData() {
            const proj = projectAttendance();
            const cutoff = getCutoffIso();
            const asOf = new Date(`${cutoff}T00:00`).toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
            return {
                project: 'holiday-planner',
                term: PLANNER.label,
                termEnd: PLANNER.endDate,
                asOf,
                batches: PLANNER.batchGroups.map(g => `${g.label} ${picks[g.id]}`),
                thresholds: TYPES.map(t => `${TYPE_LABELS[t]} ${THRESHOLDS[t]}%`).join(' · '),
                emptyNow: 'not entered',
                daysOff: [...holidays].filter(iso => BY_ISO[iso] && !BY_ISO[iso].fixed && iso >= cutoff).sort().map(iso => {
                    const d = BY_ISO[iso];
                    const raw = dayRaw(d);
                    return {
                        date: d.date, day: d.day, total: dayTotal(d),
                        subjects: SUBJECTS.flatMap(s => {
                            const t = Object.entries(raw[s.code] || {}).filter(([, n]) => n);
                            return t.length ? [{ code: s.code, name: s.name, color: uiColor(s), text: pillText(t, false) }] : [];
                        }),
                    };
                }),
                subjects: activeSubjects().map(s => ({
                    name: s.name, code: s.code, color: uiColor(s),
                    rows: TYPES.map(t => ({
                        type: TYPE_LABELS[t], min: THRESHOLDS[t],
                        now: { present: ATT[s.code][t].present, total: ATT[s.code][t].total },
                        end: { present: proj[s.code][t].present, total: proj[s.code][t].total, buffer: proj[s.code][t].buffer },
                    })),
                })),
            };
        }

        // jsPDF, the PDF maker: loaded once, when first needed, with its integrity hash checked.
        let jsPDFLoading = null;
        function loadJsPDF() {
            if (window.jspdf) return Promise.resolve(window.jspdf.jsPDF);
            jsPDFLoading ||= new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = IDKReport.jspdf.url;
                s.integrity = IDKReport.jspdf.integrity;
                s.crossOrigin = 'anonymous';
                s.onload = () => (window.jspdf ? resolve(window.jspdf.jsPDF) : reject());
                s.onerror = () => { jsPDFLoading = null; reject(); };
                document.head.appendChild(s);
            });
            return jsPDFLoading;
        }

        async function downloadReport() {
            if (needsBatch()) { showToast('Pick your batches first.'); return; }
            const button = document.getElementById('reportButton');
            const label = button.querySelector('span');
            button.disabled = true;
            label.textContent = 'Preparing…';
            try {
                const JsPDF = await loadJsPDF();
                const slug = PLANNER.label.replace(/[^A-Za-z0-9]+/g, '-').replace(/^-|-$/g, '');
                IDKReport.holidayReport(JsPDF, reportData()).save(`Holiday-report_${slug}_${getCutoffIso()}.pdf`);
            } catch (e) {
                showToast("Couldn't make the PDF. Check your internet and try again.");
            } finally {
                button.disabled = false;
                label.textContent = 'Download report';
            }
        }

        // ============================================================
        // MAIN RENDER
        // ============================================================
        function render() {
            renderBatchRow();
            renderCurrent();
            renderPlan();
        }

        setTheme(savedTheme());
        renderStatic();
        loadInitialState();
        render();
    </script>
</body>

</html>
